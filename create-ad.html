<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хабарландыру қосу - MiniMarket</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Mini<span>Market</span></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Мәзірді ашу">☰</button>
            <nav class="nav" id="navMenu">
                <a href="index.html">Басты бет</a>
                <a href="create-ad.html" class="active">Хабарландыру қосу</a>
                <a href="profile.html">Профиль</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Жаңа хабарландыру жариялау</h2>
            <form id="adForm" novalidate>
                <div class="form-group">
                    <label for="title">Тауар атауы:</label>
                    <input type="text" id="title" name="title" required placeholder="Мысалы: C++ оқулығы">
                    <span class="error-msg" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="price">Бағасы (₸):</label>
                    <input type="number" id="price" name="price" required placeholder="Мысалы: 2500">
                    <span class="error-msg" id="priceError"></span>
                </div>

                <div class="form-group">
                    <label for="category">Категория:</label>
                    <select id="category" name="category" required>
                        <option value="">Таңдаңыз...</option>
                        <option value="books">Оқулықтар</option>
                        <option value="electronics">Электроника</option>
                        <option value="clothes">Киімдер</option>
                    </select>
                    <span class="error-msg" id="categoryError"></span>
                </div>

                <div class="form-group">
                    <label for="description">Сипаттамасы:</label>
                    <textarea id="description" name="description" rows="4" placeholder="Тауардың жағдайын сипаттаңыз..."></textarea>
                </div>

                <button type="submit" class="btn">Жариялау</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MiniMarket. Кампус ішіндегі қауіпсіз сауда.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
