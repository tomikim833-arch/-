<!DOCTYPE html>
<html lang="kk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жаңа хабарландыру — MiniMarket METU</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .form-container { max-width: 600px; margin: 30px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--text-color); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 4px; display: block; }
        .preview-img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">Mini<span>Market</span> <small>METU Campus</small></a>
            <nav class="nav">
                <a href="index.html">Басты бет</a>
                <a href="profile.html">Профиль</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>📢 Жаңа хабарландыру қосу</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Тауар жайлы толық ақпарат беріңіз. Ол бірден басты бетте және профиліңізде пайда болады.</p>

            <form id="adForm">
                <div class="form-group">
                    <label for="title">Тауар атауы *</label>
                    <input type="text" id="title" placeholder="Мысалы: METU Худисі немесе Ноутбук рюкзагы">
                    <span class="error-msg" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="price">Бағасы (₸) *</label>
                    <input type="number" id="price" placeholder="Мысалы: 5000">
                    <span class="error-msg" id="priceError"></span>
                </div>

                <div class="form-group">
                    <label for="category">Категория *</label>
                    <select id="category">
                        <option value="">Таңдаңыз...</option>
                        <option value="clothes">👕 Киімдер & Худилер</option>
                        <option value="books">📚 Оқулықтар & Конспектілер</option>
                        <option value="stationery">✏️ Канцелярия</option>
                        <option value="electronics">💻 Электроника & Гаджеттер</option>
                        <option value="dorm">🛏️ Жатақхана заттары</option>
                    </select>
                    <span class="error-msg" id="categoryError"></span>
                </div>

                <div class="form-group">
                    <label for="condition">Күйі</label>
                    <select id="condition">
                        <option value="Жаңа">✨ Жаңа</option>
                        <option value="Өте жақсы" selected>👍 Өте жақсы</option>
                        <option value="Қолданылған">📖 Қолданылған</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dormLocation">Орналасқан жері (Кампус/Жатақхана)</label>
                    <select id="dormLocation">
                        <option value="№1 Жатақхана (METU)">№1 Жатақхана (METU)</option>
                        <option value="№2 Жатақхана (METU)">№2 Жатақхана (METU)</option>
                        <option value="Бас корпус (METU)">Бас корпус (METU)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Сипаттамасы *</label>
                    <textarea id="description" placeholder="Құрамы, сапасы, өлшемі немесе толық мәлімет жазыңыз..."></textarea>
                    <span class="error-msg" id="descError"></span>
                </div>

                <div class="form-group">
                    <label for="imageFile">Суретін жүктеу</label>
                    <input type="file" id="imageFile" accept="image/*">
                    <img id="imagePreview" class="preview-img" alt="Алдын ала қарау">
                </div>

                <button type="submit" class="btn-primary-sm" style="width:100%; padding:14px; font-size:16px; cursor:pointer;">🚀 Хабарландыруды сақтау және жариялау</button>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        // Суретті таңдағанда бірден көрсету (Preview)
        const imageFile = document.getElementById('imageFile');
        const imagePreview = document.getElementById('imagePreview');

        if(imageFile) {
            imageFile.addEventListener('change', function() {
                const file = this.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imagePreview.src = e.target.result;
                        imagePreview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                }
            });
        }
    </script>
</body>
</html>
